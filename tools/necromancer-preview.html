<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Некромант — анимации</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #14121c; color: #f0e7d5; font: 16px system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { color: #b8adc5; margin: 0 0 20px; }
  main { display: grid; grid-template-columns: repeat(4, 240px); gap: 12px; }
  article { background: #24212f; border: 1px solid #44394e; border-radius: 12px; overflow: hidden; }
  .stage { height: 228px; display: flex; justify-content: center; align-items: end; background: linear-gradient(#252130, #302c37); }
  canvas { flex: none; image-rendering: pixelated; }
  h2 { margin: 12px 16px 6px; font-size: 16px; }
  small { display: block; margin: 0 16px 14px; color: #b4a6c5; }
  button { margin: 18px 0; padding: 10px 18px; color: #fff; background: #624080; border: 0; border-radius: 8px; cursor: pointer; }
</style>
<h1>Некромант · вариант 1</h1>
<p>Семь анимаций. Тот же рендерер, что используется в бою.</p>
<main id="clips"></main>
<button id="replay">Повторить все</button>
<script type="module">
  import { enemyDef } from '../src/data/enemies.ts';
  import { enemySprite, playEnemyClip } from '../src/ui/enemySprite.ts';
  const def = enemyDef('necromancer');
  const clips = [
    ['idle', 'Покой', 'Дыхание и движение мантии'],
    ['bolt', 'Тёмная стрела', 'Накопление → выброс → восстановление'],
    ['summon', 'Призыв скелета', 'Движение снизу вверх'],
    ['curse', 'Проклятие', 'Жест в сторону противника'],
    ['block', 'Защита', 'Прикрывается посохом'],
    ['hurt', 'Получение урона', 'Отшатывается и выпрямляется'],
    ['death', 'Гибель и исчезновение', 'Падает → плавно исчезает целиком'],
  ];
  for (const [clip, title, subtitle] of clips) {
    const card = document.createElement('article');
    card.dataset.uid = clip;
    const stage = document.createElement('div');
    stage.className = 'stage';
    stage.append(enemySprite(def.sprite, def.id, 218, '', {}));
    const label = document.createElement('h2'); label.textContent = title;
    const note = document.createElement('small'); note.textContent = subtitle;
    card.append(stage, label, note);
    document.querySelector('main').append(card);
  }
  function replay() {
    for (const [clip] of clips) if (clip !== 'idle') playEnemyClip(document.body, clip, clip);
  }
  document.querySelector('button').onclick = replay;
  window.replay = replay;
  if (!new URLSearchParams(location.search).has('manual')) {
    setTimeout(replay, 500);
    setInterval(replay, 2600);
  }
</script>
</html>
